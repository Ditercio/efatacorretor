<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efatá Seguros - Cotação Corporativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Adicionando o Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white">
    <!-- Formulário Corrigido -->
    <section class="max-w-md mx-auto mt-20 p-8 bg-slate-900 border border-slate-800 rounded-2xl">
        <h2 class="text-2xl font-bold mb-6">Solicitar Cotação</h2>
        <form id="leadForm" class="space-y-4">
            <input type="text" id="nome" placeholder="Nome Completo" required class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white">
            <input type="email" id="email" placeholder="E-mail" required class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white">
            <input type="tel" id="whatsapp" placeholder="WhatsApp" required class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white">
            <input type="text" id="cnpj" placeholder="CNPJ" required class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white">
            <select id="tamanho_frota" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white">
                <option value="1 a 3 veículos">1 a 3 veículos</option>
                <option value="4 a 10 veículos">4 a 10 veículos</option>
            </select>
            <input type="text" id="necessidade" placeholder="Necessidade" required class="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-white">
            <button type="submit" id="submitBtn" class="w-full bg-cyan-500 py-3 rounded-lg font-bold">Enviar</button>
        </form>
        <p id="formStatus" class="mt-4 text-center text-sm"></p>
    </section>

    <script>
        const SUPABASE_URL = 'https://ddimernzteigqnrhxlyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkaW1lcm56dGVpZ3Fucmh4bHluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MjE2MzQsImV4cCI6MjEwMjQ5NzYzNH0.fkBp4jjsK-gydFpP_22Y7Bnjlqfd8pQ6q53oDrCiSCo';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('formStatus');
            btn.disabled = true;
            status.textContent = "Enviando...";

            const { data, error } = await supabase.from('leads_seguros').insert([{
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                whatsapp: document.getElementById('whatsapp').value,
                cnpj: document.getElementById('cnpj').value,
                tamanho_frota: document.getElementById('tamanho_frota').value,
                necessidade: document.getElementById('necessidade').value
            }]);

            if (error) {
                status.textContent = "Erro: " + error.message;
                btn.disabled = false;
            } else {
                status.textContent = "Sucesso! Recebemos sua solicitação.";
                document.getElementById('leadForm').reset();
            }
        });
    </script>
</body>
</html>
